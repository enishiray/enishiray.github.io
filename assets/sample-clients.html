<section><h2>このサンプルで分かること</h2><p><b>台帳</b>の見本であると同時に、<b>マスタ</b>の見本でもあります。伝票を入れるときに、取引先をコードの検索ダイアログから選んで名前を出す使い方が確かめられます。</p><p>取引先のように、他のアプリから何度も参照される情報は、こうして1つの台帳にまとめておく形が基本です。</p></section>
