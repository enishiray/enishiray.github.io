<section><h2>このサンプルで分かること</h2><p><b>集計表</b>の見本です。明細の記録をまとめた数字が、一覧の形でそのまま出ます。</p><p>入庫と出庫は区分の違う行として記録し、<b>計算項目</b>で増減数を出し、現在の在庫は<b>集計</b>で出す使い方も、このサンプルで確かめられます。</p></section>

<script>
(function(){var lb=document.getElementById('lightbox'),img=document.getElementById('lb-img');
function open(s,a){img.src=s;img.alt=a||'';lb.classList.add('open');}
function close(){lb.classList.remove('open');img.removeAttribute('src');}
var bs=document.querySelectorAll('.zoom');for(var i=0;i<bs.length;i++){(function(b){b.addEventListener('click',function(){var im=b.querySelector('img');open(b.getAttribute('data-full'),im?im.alt:'');});})(bs[i]);}
document.getElementById('lb-close').addEventListener('click',close);
lb.addEventListener('click',function(e){if(e.target===lb)close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});})();
</script>
