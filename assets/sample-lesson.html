<p class="kicker">サンプル 01</p>
<h1>個別指導の授業予定と出欠</h1>
<p class="lead">生徒と講師の授業予定をカレンダーで組み、出欠を付けるサンプルです。状態ごとに色のチップが分かれるので、空きと埋まりが一目で分かります。同梱のサンプルデータは、各表数件から数十件です。</p>

<section><h2>このサンプルで分かること</h2><p><b>カレンダー表示</b>の見本です。授業の一つひとつに色チップが付き、状態の違いが色で分かります。講師や出欠で絞り込むこともできます。</p><p>予定表は重なりを防ぐ作りになっていて、講師や生徒の予定がぶつからないよう確かめながら組めます。</p></section>
