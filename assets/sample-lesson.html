<p class="kicker">サンプル 01</p>
<h1>個別指導の授業予定と出欠</h1>
<p class="lead">生徒と講師の授業予定をカレンダーで組み、出欠を付けるサンプルです。状態ごとに色のチップが分かれるので、空きと埋まりが一目で分かります。同梱のサンプルデータは、各表 数件から数十件です。</p>
